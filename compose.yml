services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fastvue3
      POSTGRES_USER: fastvue3
      POSTGRES_PASSWORD: fastvue3
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastvue3"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 应用本身可选加入 compose；默认仅启动基础设施，应用通过 ./mvnw spring-boot:run 本地运行
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/fastvue3
      DATABASE_USERNAME: fastvue3
      DATABASE_PASSWORD: fastvue3
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret-at-least-32-bytes-long}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SPRING_PROFILES_ACTIVE: dev
      DB_STATEMENT_TIMEOUT_SECONDS: ${DB_STATEMENT_TIMEOUT_SECONDS:-15}
      DB_TRANSACTION_TIMEOUT_SECONDS: ${DB_TRANSACTION_TIMEOUT_SECONDS:-20}
      DB_LOCK_TIMEOUT_MILLIS: ${DB_LOCK_TIMEOUT_MILLIS:-5000}
      FILE_MAX_REQUEST_SIZE_BYTES: ${FILE_MAX_REQUEST_SIZE_BYTES:-11534336}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-20}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-10}
      NOTIFICATION_POLL_INTERVAL_MS: ${NOTIFICATION_POLL_INTERVAL_MS:-5000}
      FILE_MAX_SIZE_BYTES: ${FILE_MAX_SIZE_BYTES:-10485760}
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 45s
    profiles:
      - app

volumes:
  postgres_data:
