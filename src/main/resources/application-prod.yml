spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  demo:
    enabled: false
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}
  storage:
    local-root: ${FILE_STORAGE_ROOT}
  jwt:
    secret: ${JWT_SECRET}
  admin:
    password: ${ADMIN_PASSWORD}

logging:
  structured:
    format:
      console: ecs
  level:
    com.fastvue: info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
