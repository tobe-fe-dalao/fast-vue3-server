spring:
  application:
    name: fast-vue3-server
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 5000
      validation-timeout: 2000
      max-lifetime: 1800000
      connection-init-sql: "SET statement_timeout = '${app.database.statement-timeout-seconds}s'; SET lock_timeout = '${app.database.lock-timeout-millis}ms'"
  transaction:
    default-timeout: ${app.database.transaction-timeout-seconds}s
  jdbc:
    template:
      query-timeout: ${app.database.statement-timeout-seconds}s
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${app.storage.max-size-bytes}B
      max-request-size: ${FILE_MAX_REQUEST_SIZE_BYTES:11534336}B

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: ${app.database.statement-timeout-seconds}
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

server:
  tomcat:
    max-swallow-size: ${spring.servlet.multipart.max-request-size}
  shutdown: graceful
  forward-headers-strategy: none

app:
  notifications:
    delivery-enabled: ${NOTIFICATION_DELIVERY_ENABLED:true}
    poll-interval-ms: ${NOTIFICATION_POLL_INTERVAL_MS:5000}
    batch-size: ${NOTIFICATION_BATCH_SIZE:20}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:10}
  database:
    statement-timeout-seconds: ${DB_STATEMENT_TIMEOUT_SECONDS:15}
    transaction-timeout-seconds: ${DB_TRANSACTION_TIMEOUT_SECONDS:20}
    lock-timeout-millis: ${DB_LOCK_TIMEOUT_MILLIS:5000}
  demo:
    enabled: false
  jwt:
    secret: ${JWT_SECRET}
    issuer: fast-vue3-server
    audience: fast-vue3
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:900}        # Access Token 有效期（秒）
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:604800}     # Refresh Token 有效期（秒，7 天）
  admin:
    password: ${ADMIN_PASSWORD:}
    default-dev-password: admin123  # 仅供 dev 环境、且未配置 ADMIN_PASSWORD 时使用
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
  storage:
    local-root: ${FILE_STORAGE_ROOT:${java.io.tmpdir}/fast-vue3-server/uploads}
    public-base-url: ${FILE_PUBLIC_BASE_URL:/api/v1/files}
    max-size-bytes: ${FILE_MAX_SIZE_BYTES:10485760}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-} tenantId:%X{tenantId:-} userId:%X{userId:-}]"

springdoc:
  swagger-ui:
    # The public /swagger-ui.html route is handled by our localized page.
    # Keep Springdoc's generated page on an internal fallback URL so its
    # bundled Swagger UI assets remain available without an external CDN.
    path: /swagger-ui-default.html
    persist-authorization: true
    urls-primary-name: 中文
    doc-expansion: none
    display-request-duration: true
    filter: true
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
